name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'src/client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd src/client && bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint client
        run: cd src/client && bun run lint

      - name: Set up test database
        run: bun scripts/ci-setup-db.ts

      - name: Test server & shared
        run: bun run test

      - name: Test client
        run: cd src/client && bun run test -- --run

      - name: Build
        run: bun run build
